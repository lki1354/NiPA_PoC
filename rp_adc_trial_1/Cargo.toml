[package]
name = "rp_adc_trial_1"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7"
critical-section = "1.2.0"
embedded-hal = "1.0.0"
embedded_hal_0_2 = { package = "embedded-hal", version = "0.2.5", features = ["unproven"] }
fugit = "0.3.6"
heapless = "0.8.0"
nb = "1.0"
panic-halt = "1.0.0"
rp235x-hal = { version = "0.4.0", features = ["binary-info", "critical-section-impl", "rt"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.release]
opt-level = "s"
debug = true
lto = true
