[package]
name = "pico2_adc_reader"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
embedded-hal = "0.2.7"
rp2040-hal = { version = "0.9.0", features = ["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3.0"
panic-halt = "0.2.0"
usb-device = "0.2.9"
usbd-serial = "0.1.1"
fugit = "0.3.7"
heapless = "0.7.16"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
